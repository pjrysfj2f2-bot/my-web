<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的测试网站</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            background:#f0f8ff;
            font-family:system-ui;
            display:flex;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            text-align:center;
        }
        .box{
            background:#fff;
            padding:40px 30px;
            border-radius:16px;
            box-shadow:0 4px 12px #00000015;
        }
        h1{color:#2266dd;margin-bottom:16px;font-size:26px;}
        p{color:#555;font-size:16px;}
    </style>
</head>
<body>
    <div class="box">
        <h1>🎉 部署成功啦！</h1>
        <p>这是放在 Netlify 上的测试网页</p>
    </div>
</body>
</html>
